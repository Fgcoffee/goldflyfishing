# Alembic, for the web app's accounts database (not the card database).
# The server migrates itself at start-up; this is for running migrations by
# hand. The database comes from DATABASE_URL, never from this file:
#
#   DATABASE_URL=postgresql+psycopg://user:pass@host/db alembic upgrade head

[alembic]
script_location = mtgfish/web/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
